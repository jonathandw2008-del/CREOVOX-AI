# docker compose up -d db                     → PostgreSQL only (run API/worker with uv)
# docker compose --profile full up -d --build  → db + api + worker
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: creovox
      POSTGRES_PASSWORD: creovox
      POSTGRES_DB: creovox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creovox"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: ["full"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://creovox:creovox@db:5432/creovox
    ports:
      - "8000:8000"
    volumes:
      - media:/data
    depends_on:
      db:
        condition: service_healthy

  worker:
    profiles: ["full"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://creovox:creovox@db:5432/creovox
    command: ["python", "-m", "app.worker"]
    volumes:
      - media:/data
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  media:
