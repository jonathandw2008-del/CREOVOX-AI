[project]
name = "creovox-server"
version = "1.0.0"
description = "CREOVOX AI backend: auth, projects, media processing, AI generation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "google-auth>=2.30",
  "requests>=2.32",
  "anthropic>=2.0",
  "faster-whisper>=1.1",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "groq>=1.7.0",
  "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
